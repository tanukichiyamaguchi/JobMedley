[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmedley-scout"
version = "0.1.0"
description = "Automated scout system for the JobMedley (ジョブメドレー) recruitment scout platform"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# Runtime dependencies are pinned with upper bounds on purpose (13.5):
# the browser-automation library and the browser binary are a matched pair,
# and a floating type-checker / test-runner is how "green locally, red in CI"
# happens. Keep CI and local on the same versions.
dependencies = [
    "playwright>=1.49,<1.50",
    "anthropic>=0.40,<0.50",
    "pydantic>=2.9,<3.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.13,<1.14",
    "ruff>=0.8,<0.9",
    "types-PyYAML>=6.0,<7.0",
]
sheets = [
    "google-api-python-client>=2.150,<3.0",
    "google-auth>=2.35,<3.0",
]

[project.scripts]
scout = "jobmedley_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 marker. Without it, mypy resolves the installed copy as untyped and
# silently downgrades every cross-module check to Any -- which would quietly
# disable the Coord[T] enforcement this project relies on.
[tool.setuptools.package-data]
jobmedley_scout = ["py.typed", "state/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
packages = ["jobmedley_scout"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
# NOTE: always invoke as `python -m mypy`. A `mypy` binary installed by a tool
# manager runs in its own isolated environment and cannot see pydantic, which
# turns every model into `Any` and silently disables the checks this project
# relies on. 13.5 の「CIとローカルで同じ版を使う」はこの呼び出し方まで含む。
# Browser-dependent modules are intentionally thin and untestable (13.4);
# they are checked but not held to the same strictness as the pure core.
[[tool.mypy.overrides]]
module = "jobmedley_scout.browser.*"
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
