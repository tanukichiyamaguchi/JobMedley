# 医院情報 — スカウト文プロンプトの【3】に差し込む値。
#
# 出典は 2026-08-23 に運用者が渡した 医院情報／求人票 **そのもの** である。
# ここに書いてよいのは、運用者が書いた事実だけ。求人票に無いことを補って
# 書かない (原則3)。書いた瞬間、それが候補者へ届く文面の中で事実として語られる。
#
# 値の状態は3つある。混同しないこと。
#
#   通常の値        運用者が書いた事実
#   UNRESOLVED      まだ確認していない。**差し込みは止まる**
#   NOT_REQUIRED    運用者が「必要ない」と明示した。差し込みは通るが
#                   「記載なし」として渡り、プロンプトは推測を禁じられている
#
# NOT_REQUIRED を UNRESOLVED と分けているのは、「聞き忘れ」と「聞いた上で
# 要らないと言われた」を後から読み分けるためである。前者は埋めに行く宿題だが、
# 後者は宿題ではない。

# ------------------------------------------------------------------------
# 運用者の言葉 (2026-08-23):
#
#   「スカウト文のプロンプトは下記の通りです。
#     **募集職種・給与・住所・アクセス・特徴は必要ないです。**」
#
# この一文どおり、所在地・最寄駅・駐車場は NOT_REQUIRED にしてある。
# 運用者が渡した 医院情報 でも、この3欄は空のままだった (一致している)。
#
# **ただしプロンプト自身と噛み合っていない箇所が1つある。** STEP1 は
# 「医院の所在地と求職者の居住地から通勤時間を推測する」と定め、さらに
# 「自信がないので書かない」という選択は認めない、市区町村が判明しているのに
# 数値を省くことは禁止、と書いてある。所在地が無ければ距離が出せないので、
# STEP1 は本来の形では走らない。**これは推測で埋めて解決する話ではない** ので、
# 運用者の判断を仰ぐまでこのまま残す。
# ------------------------------------------------------------------------

CLINIC_NAME: "ヤガサキ歯科医院"
DIRECTOR_NAME: "矢ケ崎 隆信"

CLINIC_ADDRESS: NOT_REQUIRED
CLINIC_ACCESS: NOT_REQUIRED
CLINIC_PARKING: NOT_REQUIRED

# 求人票の「仕事内容」「診療科目・サービス形態」および医院紹介文から。
CLINIC_TREATMENTS: |
  注力分野は歯周治療と予防処置。患者様の健康を長期的にサポートすることを目指している。
  仕事内容: 予防歯科／歯周治療／ホワイトニング／診療補助／患者担当制／専用ユニットあり／
  訪問歯科／インプラント／入れ歯・補綴。
  診療科目: 一般歯科／審美歯科／矯正歯科／小児歯科。
  患者様おひとり45分の予約時間を確保してクリーニングを行う。

# 求人票に書かれている範囲のみ。**年齢層の内訳は書かれていないので書かない。**
CLINIC_STAFF: |
  専門医・認定医が在籍しており、高いレベルの知識・技術を身近に学べる環境。
  クリーンスタッフ、コールセンタースタッフが在籍。
  チームワークを大切にしており、疑問や悩みを気軽に相談できる雰囲気。
  応募要件として40代・50代も活躍中と明記されている。

CLINIC_TRAINING: |
  当院オリジナルの教育・研修カリキュラムがある。
  研修担当者が本人のペースで指導し、担当患者を持つまでサポートする。
  勉強会の開催、セミナー参加費補助、資格取得支援、マナー講習あり。
  技術や知識に不安がある場合でもマニュアルと研修があるため、
  経験者・ブランクのある方・アシスタント専門希望の方いずれも受け入れている。

CLINIC_WORKSTYLE: |
  完全週休2日制 (木・日休診。月火水金土が祝日の場合は木曜を振り替え診療)。
  8:50〜17:50 の間で実働8時間 (休憩60分)。18時までに退社可能で残業ほぼなし。
  週2〜3回は17:50に帰宅可能。研修期間終了後は週2〜3回の締め当番あり。
  年間休日120日以上、有給消化率ほぼ100%、年末年始7日程度、夏季4日程度。
  時短勤務の相談可。産休・育休の取得実績あり、育児支援あり。
  ライフイベントで働き方が変わることを医院として理解している。

# **給与は運用者が「必要ない」と言った項目なので本文には出さない。**
# ここにも書かない -- 渡せば書かれる可能性が生まれる。
CLINIC_NOTES: |
  2019年に移転しており、院内がきれいで清潔な環境。
  患者担当制のため、患者さんの変化を見守りやすく、確実にスキルが身につく。
  「〇〇さんが担当でよかった」という声をいただいている。
  ネイルOK (規定あり)、WEB面接可、LGBTQ+フレンドリー。
  応募要件は歯科衛生士免許・実務経験3年以上・60歳未満 (定年60歳のため)。
  新しい環境への不安があると思うので、まずは医院見学に来てほしい。
  当日はスタッフ全員で歓迎する。
