# ------------------------------------------------------------------------
# **未解決の設計問題: 件名が送れない**
#
# 実測20回目の送信 payload に **件名のキーが無い**。送信フォームにも件名欄は
# 無い (運用者の画面で確認済み)。つまりこの媒体では、こちらが件名を決めて
# 送ることができない。
#
# ところが返信検知 (10.2 / reply/subject_match.py) は「返信の件名が
# `Re: 送信した件名` になる」という前提で組んである。送っていない件名と
# 突合すれば、**返信は永久に0件になる。しかも静かに成功する** (原則2)。
#
# これは座標を1つ埋めれば済む話ではなく、突合キーの設計そのものである。
# 段階3で受信箱 (inbox.*) を観測してから決める。候補は3つ:
#   (a) 媒体が自動で付ける件名を観測し、それを突合キーにする
#   (b) 会員番号などIDで突合する (件名を使わない)
#   (c) 本文の先頭に目印を入れて突合する
#
# **決まるまで sync-replies を有効にしない。** inbox.* が UNRESOLVED なので
# 現状は起動しないが、埋めるときにこの問題を思い出すためにここへ書いておく。
# ------------------------------------------------------------------------

