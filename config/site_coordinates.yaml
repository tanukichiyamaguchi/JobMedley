api.base_url: "https://customers.job-medley.com"

# 候補者一覧取得APIのURL (ページング付き)。
#
# **まだ観測していない。** 一覧は武装より前に読み込まれるので、いまの偵察
# (follow-send / capture-open) の記録には入らない。
#
# **ここは急ぐ理由がある。** 送信の payload に searchUuid が載っていた
# (api.send.paid.payload_template を参照)。つまり送信は「どの検索から辿り着いた
# 候補者か」に紐づいており、**一覧の応答から searchUuid を持ち出せなければ
# 送信は組み立てられない**。
api.candidate_list.url_pattern: UNRESOLVED

# 候補者レジュメ取得APIのURL。
