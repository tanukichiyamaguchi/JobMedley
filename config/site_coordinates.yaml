enums.membership.qualifying_values: UNRESOLVED

# マイページから受信箱へ遷移するリンク。
# **直接URL遷移では一覧の通信が発火しない** (10.3) ため、クリックで辿る導線が必要。
inbox.entry_link_selector: UNRESOLVED

# 受信箱一覧を返す非同期通信のURLパターン。
# DOMではなく**この応答本文**に対して照合する (10.3)。
inbox.list_response_url_pattern: UNRESOLVED

# 応答本文の中で件名が入っている位置。
# 返信行は 'Re: 送信した件名' になる (10.2)。
inbox.subject_json_path: UNRESOLVED

# 次ページへ進める操作。
# **終了判定には使わない** -- 終了は内容の署名で行う (10.5)。
# DOMにページャが無い前提で書くこと。
inbox.next_page_control: UNRESOLVED

# ------------------------------------------------------------------------
# **参照実装由来の軸。この媒体に在るかは未確認。**
#
# 下の followup.* は「送信時に追客日数を指定できる」ことを前提にしている
# (参照実装は3日・5日・10日の3値だった)。段階3で観測した送信 payload の中身は
#     jobOfferId / jobOfferSalaryId / memberId / scoutMessage / searchUuid
# の5つで、**追客に当たる項目は無い**。送信フォームにも追客の欄は無かった。
#
# **これでも「無い」と断定しない** (原則3)。観測したのは画面が投げた1本の
# リクエストであって、APIのスキーマではない。段階4-1 (配信JSを読む) で
# SendSingleScoutInput の定義を見れば決着する。
# ------------------------------------------------------------------------

# 媒体標準の追客(リマインド)機能があるか。
# あれば自前再送と二重にならないよう設定でどちらか一方に決める (9.8)。
followup.native_supported: UNRESOLVED

# 媒体標準の追客を指定する送信payloadのパラメータ名。
# 無ければ null。
# **オプショナルなネスト構造なら入口でガードすること** (6.7)。
# (存在しないことが確認できた場合は null と書いてよい)
followup.param_name: UNRESOLVED

# 追客日数として媒体が受け付ける値 (参照実装は3日・5日・10日の3値のみ)。
# 想定外の値は既定値に丸める。
# 無ければ null。
# (存在しないことが確認できた場合は null と書いてよい)
followup.allowed_days: UNRESOLVED

# ========================================================================
# 段階4: dryRun付きの送信検証
# ========================================================================

# **画面に出ているIDと、送信APIが要求するIDが同じか** (4章)。
# 違えば true。
# 歴史のある媒体は新旧サブシステムが同居してID体系が分断されていることがある。
id.bridge_required: UNRESOLVED

# ========================================================================
# 段階6: 少件数での本番送信
# ========================================================================

# APIで橋が架からない場合に、UIから正しいIDを拾う要素 (コピー用URL要素など)。
# id.bridge_required が false なら null。
# (存在しないことが確認できた場合は null と書いてよい)
id.bridge_attribute_selector: UNRESOLVED

# 上記要素の属性値からIDを抜く正規表現 (捕捉グループ1がID)。
# 不要なら null。
# (存在しないことが確認できた場合は null と書いてよい)
id.bridge_extract_pattern: UNRESOLVED
