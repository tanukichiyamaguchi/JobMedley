# 媒体座標 — ジョブメドレー
#
# **このファイルの UNRESOLVED は未完成ではなく、方針である。**
#
# 指示書の一貫した方針は「推測で埋めないこと」(原則3・6.4・8.3・16章)。
# ここに並んでいるのは、実際にログインして観測しない限り知りようがない値
# ばかりであり、推測で埋めるとその推測がそのまま送信内容と対象判定に出る。
#
# 埋め方:
#   1. `scout coordinates` で未確定の一覧と取得方法を表示する
#   2. docs/ladder.md の該当段階の手順を実施する
#   3. 観測できた値をここに転記する (偵察コマンドの出力は座標キー名付きで出る)
#
# 記法:
#   UNRESOLVED  … まだ確認していない (既定)
#   null        … 確認した結果、存在しなかった (nullable な座標のみ)
#
# この2つは意味が違う。null は確定した答えであり、UNRESOLVED は未確定である。
# 全キーが必須。省略すると打鍵ミスと同じく検証エラーになる (7.6)。


# ========================================================================
# 段階1: ログインセッションの取得
# ========================================================================

# https://customers.job-medley.com/customers/sign_in/ を開き、実際にフォームが描画されるURL (リダイレクト後) をアドレスバーから転記する。
auth.login_url: "https://customers.job-medley.com/customers/sign_in/"

# ログイン画面で右クリック→ページのソースを表示。
# フォーム要素がHTMLに含まれていれば false (旧来型)、空の div だけなら true (SPA)。
# true の場合、送信ボタンのクリックに Enter キーのフォールバックは効かない (5.5)。
auth.is_spa: true

# ログインフォームのメールアドレス入力欄。
# 開発者ツールで要素を検査し、name/id 属性ベースの安定したセレクタを選ぶ。
auth.email_selector: "input[name=\"email\"]"

# ログインフォームのパスワード入力欄。
auth.password_selector: "input[name=\"password\"]"

# ログインの送信ボタン。
# SPAの場合は複数のテキスト候補で探す方式にするため、auth.submit_text_candidates も併せて埋めること (5.5)。
auth.submit_selector: "button[type=\"submit\"]"

# 送信ボタンの表示文字列の候補 (例: ['ログイン', 'サインイン'])。
# セレクタが効かなかったときのフォールバック。
auth.submit_text_candidates: ["ログイン"]

# **ログイン後にのみ存在する要素**のセレクタ (「ログアウト」リンクなど)。
# 遷移の完了やステータスコードで判定してはならない (5.5)。
# 手動ログイン後に開発者ツールで探すのが確実。
auth.success_marker_selector: "a.c-header-menu__logout-link"

# 2段階認証の種別: none / sms / totp / email_link のいずれか。
# email_link の場合、CI側で突破する手段が無いため手動ログイン＋セッション持ち込みがほぼ必須になる (4章・5.4)。
auth.twofa_kind: "none"

# ========================================================================
# 段階2: 起動前チェック
# ========================================================================

# 手動ログイン直後に候補者一覧のURLへ直接遷移してデータが返るかを試す。
# 返らなければグループ/拠点/求人アカウントの選択ステップが挟まっている (4章)。
# その場合 true にし、context.selector を埋める。
#
# 2026-08-13 `scout recon observe-list` で観測: 保存セッションで候補者一覧URLへ
# 直接遷移したところ、同じパスに着地した (転送なし)。選択ステップは無い。
context.selection_required: false

# グループ/拠点の選択コントロール。
# 選択が不要なら null。
# (存在しないことが確認できた場合は null と書いてよい)
#
# **UNRESOLVED ではなく null。** 上の観測で「選択が不要」と確認できたので、
# これは未確認ではなく「確認した結果 存在しない」である。
context.selector: null

# ログイン後のトップ/マイページのURL。
nav.mypage_url: "https://customers.job-medley.com/"

# 候補者一覧 (検索結果) の画面URL。
nav.candidate_list_url: "https://customers.job-medley.com/customers/searches?lg=0&da[0][pid]=14&da[0][cid][0]=14131&da[0][cid][1]=14132&da[0][cid][2]=14133&da[0][cid][3]=14134&da[0][cid][4]=14135&da[0][cid][5]=14136&da[0][cid][6]=14137&da[0][cid][7]=14152&da[0][cid][8]=14102&da[0][cid][9]=14109&da[0][cid][10]=14118&da[1][pid]=13&da[1][cid][0]=13104&da[1][cid][1]=13113&da[1][cid][2]=13209&da[1][cid][3]=13206&da[1][cid][4]=13208&da[1][cid][5]=13225&da[1][cid][6]=13224&df[0]=236&df[1]=255&df[2]=524&df[3]=715&df[4]=254&df[5]=521&df[6]=13&df[7]=260&df[8]=574&df[9]=144&addr[0][pid]=&et[0]=1&gdr[0]=1&customer_search_condition_id=739599&received_favorite_job_offer[pid]=0&received_favorite_job_offer[jcid]=0&received_favorite_job_offer[keyword]=&career_jobs[0][type]=job_category_id&career_jobs[0][value]=10&career_jobs[0][cy]=&scouted_member_job_offer[pid]=0&scouted_member_job_offer[jcid]=0&scouted_member_job_offer[keyword]=&pagination[page]=1&pagination[limit]=25&desired_job_category_ids[0]=10&age[from]=0&age[to]=40"

# 候補者一覧の描画完了を表す要素。
# **「通信の静止」を待ってはならない** (5.3) ので、この要素の出現を待つ。
#
# 2026-08-13 `scout recon observe-list` (4回目) の構造スナップショットから
# `replay-list` で導出。「行が出た **または** 0件表示が出た」で成立する
# (カンマは論理和)。
#   行     : div.c-search-member-card  (結果ページに25個、0件ページ2種で全滅を確認)
#   0件表示: div.c-not-found--searches (0件ページ2種の両方に存在、結果ページに無し)
# 0件表示の要素は c-not-found と c-not-found--searches を同じノードに持つ。
# 修飾付きの方を採る -- 素の c-not-found は検索以外の画面 (エラー表示等) でも
# 使われうる汎用ブロックで、それを0件と読むと静かなゼロ件 (原則2) になる。
# --searches 側なら、別画面に落ちたときは待ちが満了して **見えて** 失敗する。
# 別案 (同じ観測に基づく): "div.c-search-member-card, div.c-not-found"、
# "div.c-search-conditions" (検索応答の描画後にのみ現れる要素)。
nav.list_ready_selector: "div.c-search-member-card, div.c-not-found--searches"

# 候補者ドロワー/モーダルを閉じるコントロールの候補を、**実画面で確認した順**に。
# 総当たりして駄目ならEscape、それでも消えなければ一覧へ再遷移する (5.7)。
#
# 2026-08-13 観測 (4回目) の記録: 結果ページのDOMに閉じ操作の器が実在する --
#   div.c-side-cover (u-is-hidden で待機) の中に a.c-side-cover__close-btn
#   複数の div.c-modal (js-modal) の中に a.c-modal__closer
# 2026-08-14 観測 (5回目) で、クリックを遮っていたのはツアー案内
# (a.c-tour-guide__overlay) と確定。6回目のスナップショットで吹き出しの中身も
# 確定した: 汎用ボタン1つだけの「次へ」型で、閉じる/スキップの部品は無い。
#
# **7回目でツアーの自動完走が機能し、カードのクリックは完了した。それでも新出
# 要素は無かった** -- カード本体のクリックはドロワーを開かない、とほぼ確定した。
# ドロワーは「レジュメを見る」等のボタンで開くが、カードのボタン2つのうち片方は
# js-tour-guide-scout-button (スカウト送信 = 押してはいけない)、もう片方は文言を
# 読まない限り用途を確定できない (13.2/13.6)。**observe-list の追加往復では
# これ以上進まない。** 段階3の capture-send (送信遮断を武装した状態) で、
# 未知のボタンを安全に押して送信路と一緒に確認する。
# 旧メモ: 次の observe-list は3段の梯子でツアーを閉じてから押す (文言ヒント →
# 吹き出しの最後のボタンで最後まで進める (上限10回) → 背景クリック1回。
# いずれも div.c-tour-guide の中だけ・scout を class に含む要素は押さない)。
#
# 2026-08-18 capture-open 5回目で **ドロワーの正体が分かった**。
# カードの button.c-button.u-wd-100p.c-button--small (スカウトでない方) を押すと
#   POST /api/customers/graphql/MemberOnScoutProfileModalOfDesktop
# が飛ぶ。名前のとおり **候補者プロフィールのモーダル** を開くための読み取りで
# ある。つまりドロワーは在るが、**中身をGraphQLで取ってから描画される**。
# この回はその読み取りごと遮断していたため、媒体の共通エラー処理が働いて
# /customers/network_error/ へ飛ばされ、モーダルは一度も開かなかった。
# 次の capture-open は読み取り (GraphQL の query) を通すので、開いたモーダルの
# 中から閉じる部品を観測できる見込み。
#
# 2026-08-18 capture-open 6回目で **実際に開いた**。通した読み取りが証拠:
#   graphql/MemberOnScoutProfileModalOfDesktop  候補者プロフィールのモーダル
#   graphql/GetScoutSideCoverInfo               スカウトのサイドカバー (= ドロワー)
#   graphql/JobOfferSearchOnScoutMessageForm    スカウト送信メッセージフォーム
# ドロワーは「サイドカバー」と呼ばれる作りで、開くと body に
# c-body--fixed-by-sidecover が付く (背面のスクロールを止めるため)。
# ただしこの回は測る時機が早すぎ (読み込み表示を領域と誤認)、閉じる部品までは
# 観測できなかった。次回は中身が届いてから測る。
nav.drawer_close_selectors: UNRESOLVED

# ========================================================================
# 段階3: 偵察 (内部APIの特定)
# ========================================================================

# 内部APIのオリジン。
# 2026-08-20 follow-send 2回目で観測。遮断して記録した送信リクエストのURLが
# このオリジンを向いていた。
api.base_url: "https://customers.job-medley.com"

# 候補者一覧取得APIのURL (ページング付き)。
#
# 2026-08-21 observe-api 3回目で **観測した**。媒体のオリジンを素通しにして
# 一覧を開き、飛んだ応答19本のキーの形を全部読んだ。候補者の並びを返していたのは
# 1本だけだった::
#
#     POST /api/customers/members/search/
#       members[]                                 <array> [25]
#       members[].id / .code / .age / .gender_name / .short_address
#       members[].qualifications[] / .member_desired_job_categories[]
#       members[].member_career_job_categories[] / .last_sign_in_at
#       members[].scouted / .scouted_at_list[] / .scouted_job_offer_ids[]
#       members[].has_careers / .has_self_pr / .read_profile / .hot
#       search_uuid                               <string>
#       total / page / limit / next_cursor
#
# **値は1つも見ていない** (13.2)。見たのはキーの名前と値の種別だけである。
# それでも一意に決まったのは、他の18本が候補者の並びではなかったからである
# (求人・通知・残数・検索条件の一覧・保存条件のラベル)。
#
# **GET ではなく POST である。** api/endpoints.py の method もそれに合わせた。
api.candidate_list.url_pattern: "https://customers.job-medley.com/api/customers/members/search/"

# 候補者一覧の **要求本文** の雛形。
#
# 2026-08-22 observe-api 4回目で **観測した**。一覧が飛ばした POST の本文を、
# 値抜きでキーの形だけ読んだ (40キー)。
#
# **``label.search_form`` とは別物だった。** 前回「似ている」と書いたが、実際は
# 包み (``search_form``) が無く、``version`` / ``ignore`` / ``customer`` /
# ``name`` / ``mail`` / ``created_at`` / ``updated_at`` も無い。逆に
# ``desired_areas[].city_id`` と ``desired_areas[].cities`` はこちらにしかない。
# **名前が似ていることは同じものである証明ではない** (原則3) -- 貼っていたら
# 通らない本文になっていた。
#
# 実際の値は **運用者が保存した検索条件そのもの** なので、ここには入れない
# (13.2)。``<...>`` は「この種別の値がここに入る」という観測であって、
# 送る値ではない。実行時に差し替えるのは下の2つの目印だけである::
#
#   {{SEARCH_CONDITION_ID}}   保存した検索条件のID (画面の「実践会＿衛生士」)
#   {{PAGE}} / {{PAGE_SIZE}}  ページ繰り
#
# **注意: 本文の ``member_id`` は絞り込み条件であって、送信payloadの memberId
# ではない。** 同名の別物である (6.4 の業界/職種の取り違えと同じ形)。
api.candidate_list.payload_template: |
  {
    "age": {"from": "<string>", "to": "<string>"},
    "desired_areas": [
      {
        "prefecture_id": "<string>",
        "city_ids": ["<string>"],
        "city_id": "<string>",
        "cities": []
      }
    ],
    "addresses": [
      {"prefecture_id": "<string>", "city_ids": [], "cities": []}
    ],
    "desired_features": ["<number>"],
    "desired_job_category_ids": ["<number>"],
    "employment_statuses": [],
    "employment_types": ["<number>"],
    "favorite": "<bool>",
    "careers": "<bool>",
    "career_job_categories": [{"job_category_id": "<number>"}],
    "career_job_contents": [],
    "self_pr": "<bool>",
    "scout": "<number>",
    "read_profile": "<number>",
    "genders": ["<number>"],
    "last_education_ids": [],
    "last_login": "<string>",
    "member_id": [],
    "member_qualification_ids": [],
    "qualifications_match_all": "<bool>",
    "include_qualifications_acquisition_scheduled": "<bool>",
    "desired_join_times": [],
    "recommend": "<bool>",
    "customer_search_condition_id": "{{SEARCH_CONDITION_ID}}",
    "recently_registered": "<bool>",
    "pagination": {"limit": "{{PAGE_SIZE}}", "page": "{{PAGE}}"},
    "sort": "<string>",
    "nav_type": "<number>"
  }

# ------------------------------------------------------------------------
# **候補者一覧に氏名は無い。**
#
# 2026-08-22 observe-api 4回目で応答のキーを全部読んだ。候補者1件あたりに
# 載っているのはこれだけである::
#
#     id / code / age / gender_name / short_address / desired_cities
#     member_desired_employment_types / member_education_background
#     member_careers / employment_status_name / qualifications[]
#     member_desired_job_categories[] / member_career_job_categories[]
#     member_desired_join_time / last_sign_in_at
#     scouted / scouted_at_list[] / scouted_job_offer_ids[]
#     added_favorite_job_offers_of_customer
#     has_careers / has_self_pr / unqualified / recently_registered
#     read_profile / hot
#
# **氏名の欄が無い。** ``code`` は会員番号であって名前ではない。
#
# 参照実装は氏名がある前提で書かれており、models.candidate.Candidate は
# display_name を必須にしていた。**この媒体では埋めようがない。**
# ``code`` を入れれば「氏名: 3323741」として生成に渡り、モデルはそれを名前と
# 見なして文面に書く -- 6.4 の取り違えと同じ事故になる。
#
# したがって display_name は **空のままにする** (6.4 の手順3)。空なら
# generation.facts が「非公開」として渡すので、モデルは名前に言及できない。
#
# **レジュメ側に在るかは未確認** (api.resume.url_pattern が未確定のため)。
# 在ると分かったらそのとき埋める。無いと分かるまで「無い」とも書かない。
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------

# 候補者レジュメ取得APIのURL。
#
# **手がかりはあるが、確定していない。** 偵察が通した読み取りの中に
#   graphql/MemberOnScoutProfileModalOfDesktop
# があり、名前と出る場面 (カードの「プロフィール確認」を押したとき) からは
# これらしい。ただし **応答の中身を見ていない** ので、レジュメの全項目が
# ここで取れるのかは分からない。推測で埋めない (原則3)。
api.resume.url_pattern: UNRESOLVED

# 送信前チェック (既送信・対象外の除外) API。
# 無ければ null。
# (存在しないことが確認できた場合は null と書いてよい)
api.precheck.url_pattern: UNRESOLVED

# 送信枠の残数照会API。
#
# 2026-08-21 observe-api 3回目で **観測した**。一覧を開くと必ず飛んでいる::
#
#     GET /api/customers/messages/scout_count/
#       remaining_count   <number>
#       total_count       <number>
#
# **これは 8章の「残数は毎回読む」を満たす**。運用者の画面で2日のあいだに
# 62通 -> 51通 と動いており、引き算で持つと必ずずれる (媒体側で人が送る、
# 月次でリセットされる)。``remaining_count`` をそのまま読む。
#
# **値は見ていない。** 見たのはキーの名前と種別だけである (13.2)。
# どちらの数が「残り」かは名前が述べているが、突き合わせは段階4で行う。
api.quota.url_pattern: "https://customers.job-medley.com/api/customers/messages/scout_count/"

# 冪等キーを載せるヘッダ名。
#
# 2026-08-20 follow-send 3回目で、実際の送信リクエストの **ヘッダ名を全て**
# 観測した (値は観測していない -- cookie の値はセッションそのものである)::
#
#   accept, accept-language, content-type, cookie, origin, referer,
#   sec-ch-ua, sec-ch-ua-mobile, sec-ch-ua-platform, user-agent
#
# **どれも素のブラウザが付けるヘッダで、冪等キーの受け口は無い。**
# (CSRFトークンのヘッダも無い。cookie と origin で守っている作りである。)
#
# **この観測が言えること**: 媒体自身のクライアントは冪等キーを送っていない。
# **言えないこと**: サーバが受け付けないこと。ただし自前のクライアントが勝手な
# ヘッダを足しても、受け口が無ければ黙って無視されるだけである。
#
# したがって 9.2 の代替手順に従う -- **再試行の前に送信済み一覧を照会する**。
# あわせて 12.5 のとおり、送信APIの自動再試行はそもそも行わない。
api.idempotency_header: null

# 有料枠の送信API。
#
# 2026-08-20 follow-send 2回目で **観測** した。教わった導線を順に辿り
# (一覧の「スカウトを送る」→ 求人を選ぶ → 本文に目印 → 確認して送る)、最後の
# 押下で飛んだ非GETのうち、**本文へ書き込んだ目印を載せて運んでいた** のがこれ:
#
#   POST /api/customers/graphql/SendSingleScout
#
# 目印が載っていたことが、これが送信路であることの根拠である (原則3: 同時に
# 遮断された計測ビーコン7件と、推測ではなく観測で区別できている)。
# **この通信は中断済みで、送信は行われていない。**
api.send.paid.url_pattern: "https://customers.job-medley.com/api/customers/graphql/SendSingleScout"

# **成功とみなすHTTPステータスの集合。
# ** エンドポイントごとに違う (参照実装では 200 と 201 が混在した、6.2)。
# 段階4のdryRun検証で実測する。
#
# **注意: 送信は GraphQL である。** GraphQL は失敗しても HTTP 200 を返し、
# 応答本文の errors 配列にエラーを入れる作りが普通である。ステータスコードだけを
# 見る判定は **失敗を成功と数える** -- 原則2 の「静かなゼロ件」そのものになる。
# 段階4では本文の errors も併せて実測すること。
api.send.paid.success_statuses: UNRESOLVED

# 有料枠のpayload形状。
#
# 2026-08-20 follow-send 3回目で **観測** した。値はすべて種別に伏せてある
# (13.2)。伏せていないのは「本文がどのキーに入るか」だけで、それは自分で書いた
# 目印がそこに載っていたという観測そのものである。
#
# **推測では1つも当たらなかったはずの形である。**
#   - 本文のキーは body ではなく **scoutMessage**
#   - 求人IDだけでなく **jobOfferSalaryId** も要る (求人を選ぶと一緒に決まる)
#   - **searchUuid** が載る。送信は「どの検索から辿り着いた候補者か」に紐づく
#   - 件名の欄は無い (フォームにも無い)
#
# **この雛形はまだ送信に使えない。** 理由は2つある。
#
# 1. **問い合わせ文 (query) が入っていない。** これを記録した回の偵察は
#    「長いから」という理由で query を落としていた。GraphQL は query の無い
#    リクエストを受け付けないので、貼っても送れない。**次の follow-send が
#    封筒ごと記録するので、その出力で丸ごと差し替えること。**
# 2. **``<...>`` の欄が埋まっていない。** どれも観測はしたが、こちらが用意する
#    値である (どの求人へ送るか、どの検索から辿ったか)。
#
# 埋め忘れたまま送ろうとしても、api.payloads.assert_fully_filled が送信の前に
# 止める。``<string>`` という文字列がスカウトとして飛ぶことは無い (13.6)。
api.send.paid.payload_template: |
  {
    "operationName": "SendSingleScout",
    "variables": {
      "input": {
        "jobOfferId": "<number>",
        "jobOfferSalaryId": "<number>",
        "memberId": "<number>",
        "scoutMessage": "{{BODY}}",
        "searchUuid": "<string>"
      }
    }
  }

# ------------------------------------------------------------------------
# **送信payloadの5つの値が、どの読み取りから来るのか。**
#
# 2026-08-21 observe-api 3回目で、4つは出所らしいキーが見つかった。
# **名前が一致しただけで、値が同じである確認はまだ取れていない** (原則3)。
# 突き合わせは段階4で行う。
#
#   memberId          <- POST /api/customers/members/search/
#                          members[].id
#   searchUuid        <- POST /api/customers/members/search/
#                          search_uuid           (同じ応答に載っている)
#   jobOfferId        <- GET  /api/customers/job_offers/published/?limit=...
#                          data.job_offers[].id
#   jobOfferSalaryId  <- 同上
#                          data.job_offers[].job_offer_salaries[].id
#   scoutMessage      <- こちらが生成する本文 (座標ではない)
#
# **searchUuid が候補者一覧と同じ応答に載っていたことは、設計上の朗報である。**
# 送信は「どの検索から辿り着いた候補者か」に紐づいているので、別に取りに行く
# 経路が要るかもしれなかった。1回の一覧取得で候補者と検索識別子が揃う。
#
# **求人は候補者ごとではなく事前に1回取れる。** job_offers/published は一覧を
# 開いた時点で飛んでおり、``limit`` 付きのGETである。運用上は「どの求人へ
# 送るか」を先に決めて固定するので、送信のたびに引く必要は無い。
#
# 重複送信の判定にも同じ応答が使える::
#
#   members[].scouted                <bool>
#   members[].scouted_job_offer_ids  <array>
#   members[].scouted_at_list        <array>
#
# **ただしこれを唯一の根拠にはしない** (9章)。媒体側の値であり、こちらの
# 送信記録 (state) と食い違ったときにどちらが正かは決められていない。
# 突き合わせて、食い違ったら送らない側へ倒す。
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------
# **同じ回に観測した、いま使わない読み取り。** 記録だけしておく。
# 名前とURLは観測そのもので、値は1つも見ていない (13.2)。
#
#   POST /api/customers/customer_search_conditions/search_manual/
#        保存した検索条件の一覧 (画面の「実践会＿衛生士」等)
#   POST /api/customers/customer_search_conditions/label/
#        保存条件の中身 (label.search_form。46キー)
#   POST /api/customers/scouted_members/search/
#        送信済み候補者の一覧 (scouted_members[], total, count, limit)
#   POST /api/customers/received_favorites/search/
#        「気になる」を押した候補者の一覧
#
# scouted_members/search は 9章の重複判定の照会先になりうるが、**応答に
# 会員IDが載っているかを確認していない** (見えたキーは job_offer_id と title
# だけだった)。確認するまで重複判定の根拠にはしない (原則3)。
# ------------------------------------------------------------------------

