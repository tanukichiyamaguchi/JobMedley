# ------------------------------------------------------------------------
# **レジュメの応答で新たに分かったこと** (2026-08-22 observe-resume 2回目)。
#
# 101キーを値抜きで読んだ。実画面より多いものが3つある。
#
# 1. **スカウト履歴が構造化されて載っている。** 9章の重複判定と追客に直結する::
#
#      scoutHistories[].jobOffer.id / .facility.name / .jobCategory.name
#      scoutHistories[].jobOffer.altJobCategoryName / .salaries[]
#      scoutHistories[].latestSentAt    <string>   最後に送った日時
#      scoutHistories[].sentCount       <number>   送った回数
#      scoutHistories[].latestRefusedAt <null>     **辞退された日時**
#
#    **latestRefusedAt は画面に出ていなかった。** 候補者はスカウトを辞退できる。
#    辞退された相手へ送り続けるのは最悪の失敗なので、送信前判定に必ず入れる。
#    ただし **null 以外の値をまだ見ていない** ので、形も意味も推測しない (原則3)。
#
#    **辞退はもう1箇所にも在る。** 問い合わせ文の求人側にこれがある::
#
#      jobOffer.refuseScoutMemberIds
#
#    「この求人へのスカウトを辞退した会員ID」の列である。scoutHistories が
#    候補者側から見た辞退で、こちらは求人側から見た辞退である。**同じ事実を
#    2方向から持っているのか、別の事実なのかは確認していない。**
#    突き合わせるまでどちらか一方を根拠にしない (原則3)。
#
# 2. **こだわり条件が id 付きで取れる**::
#
#      desiredCondition.features[].id / .name
#
#    実画面の「社会保険完備, 週休2日, ネイルOK, 育児支援あり…」がこれである。
#    **氏名が無い以上、これが個別化の主材料になる。** 求人側の features[] と
#    同じ語彙なら突き合わせられるが、**同じ語彙である確認はまだ取れていない**。
#
# 3. **資格に取得年月と取得予定フラグが付く**::
#
#      appeal.qualifications[].name / .isScheduled
#      appeal.qualifications[].acquisitionYear / .acquisitionMonth
#
#    isScheduled は「取得予定」である。**取得済みと取得予定を混ぜて
#    「◯◯をお持ちの方へ」と書くと嘘になる。**
#
# **氏名はやはり無い。** personalInformation に在るのは address / age / gender /
# employmentStatus / recentlyRegistered の5つだけで、名前の欄は101キーのどこにも
# 無い。運用者の「取得できるのは会員番号のみ」が API 側でも裏付けられた。
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------
# **レジュメに何が載っているか** (2026-08-22 運用者が実画面を提供)。
#
# これは **画面の項目名であって、APIのキーパスではない。** 当たりを付けるために
# だけ使い、resume.fields.* に書くのは応答の形を観測してからである (原則3)。
#
#   基本プロフィール
#     会員番号        01613058
#     氏名(ふりがな)  （未応募のため非表示）      ← 後述
#     性別 / 年齢     女性 / 24歳
#     電話番号        （未応募のため非表示）      ← 後述
#     居住地          神奈川県川崎市多摩区
#     現在月収        30万円
#     最終学歴        歯科衛生士科（専門学校）(2023年3月卒業)
#     就業状況        就業中
#     資格            歯科衛生士, 自動車運転免許
#     経験職種        歯科衛生士(3年)
#
#   希望条件
#     希望職種        歯科衛生士
#     希望勤務地      東京都, 神奈川県川崎市多摩区, 東京都立川市, 東京都調布市
#     希望勤務形態    正職員
#     希望入職時期    3か月以内 (2026/06/25時点)
#     希望年収        400万円
#     こだわり条件    社会保険完備, 週休2日, ボーナス・賞与あり, 交通費支給,
#                     年間休日120日以上, ネイルOK, 育児支援あり,
#                     祝日の振替診療なし, 有給消化率ほぼ100%
#     気になる        未入力
#
#   パーソナリティ
#     自己PR          未入力
#
#   スカウト履歴
#     医療法人幸明会 ヤガサキ歯科医院 歯科衛生士(正職員)
#     送信日:2026/08/17 (5日前) / 全6回
#
# **こだわり条件が個別化の主材料になる。** 氏名が無い以上、文面を「その人向け」に
# するのはここと資格・経験年数・希望勤務地である。
#
# **スカウト履歴は9章の重複判定に使える。** ただし媒体側の値であり、こちらの
# 送信記録と食い違ったときにどちらが正かは決めていない。突き合わせて、食い違ったら
# 送らない側へ倒す。
#
# **「プロフィール」と「職務経歴」の2つのタブがある。** 上は「プロフィール」側
# だけである。職務経歴タブの中身は未観測で、別の通信が要るかも分からない
# (一覧の ``members[].has_careers`` がその有無を示していると思われる)。
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------
# **なぜ氏名が取れないのか** (2026-08-22 問い合わせ文を読んで分かった)。
#
# 画面には「（未応募のため非表示）」と出るので「値が伏せられている」と書いて
# いた。**仕組みが違った。** 問い合わせ文にはこう書いてある::
#
#     fragment BasicInformationOnMemberProfileOfPC on Member {
#       ... on AppliedMember {
#         personalInformation {
#           name { firstName lastName firstNameKana lastNameKana }
#           address { ... town building }
#           age gender tel contactNotes numberOfDependents hasSpouse
#           employmentStatus recentlyRegistered
#         }
#         latestEducationBackground { ... schoolName ... }
#         resumeUrl careerSheetUrl
#         applications { ... }
#       }
#       ... on UnAppliedMember {
#         personalInformation {
#           address { prefecture city }     # town も building も無い
#           age gender employmentStatus recentlyRegistered
#         }
#         latestEducationBackground { ... }  # schoolName が無い
#       }
#     }
#
# **Member は AppliedMember と UnAppliedMember の2種類である。** 氏名・電話番号・
# 番地・学校名・履歴書URL・応募履歴は **AppliedMember にしか無い**。スカウトの
# 相手は未応募なので、これらは伏せられているのではなく **返ってこない**。
#
# 画面の「（未応募のため非表示）」は、媒体のUIが欄を残して埋めている文言である。
#
# **結論は変わらない** (氏名は取れない) が、理由が違う。取れるようになる条件も
# 違う -- 候補者が応募すれば AppliedMember になり、氏名が返る。
#
# **問い合わせ文を自分で短く書き直さないこと。** 出し分け (``... on``) を落とすと
# 応答が静かに空になる。媒体自身のクライアントが送る文書をそのまま使う。
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------
# **伏せ字を値として扱わないこと。**
#
# 自己PRと気になるは未入力だと画面に「未入力」と出る。**それが API から来た
# 文字列なのか、UIが埋めた文言なのかは確認していない** -- 観測したキーは
# ``appeal.selfPr: <string>`` で、空文字も「文字列」と数えられるからである。
#
# どちらであっても、**素直に写せば「未入力」が自己PRとしてモデルへ渡る**。
#
# 素直に写せば display_name に「（未応募のため非表示）」が入り、
# generation.facts はそれを値として渡し、モデルは「（未応募のため非表示）様」と
# 書く。取り消せない (13.6)。自己PRも同じで、渡せばモデルは「自己PRに『未入力』と
# ご記入されており」と書きうる。
#
# recon.masked.unmask() が None へ落とす。**取り込み経路は必ずここを通すこと。**
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------
# **画面での送信の流れ** (2026-08-22 運用者が提供)。API経路との違いを残す。
#
#   1. カードの「スカウトを送る」→ フォームが開く
#   2. 「スカウト対象求人」を入力 → 「検索条件に似ている求人」から選ぶ
#      候補の表記は「都道府県 施設名 職種 勤務形態」::
#          神奈川県 医療法人幸明会 ヤガサキ歯科医院 歯科衛生士 正職員
#          神奈川県 ダイヤモンド歯科医院 歯科衛生士 正職員
#   3. 「メッセージテンプレート」を選ぶ → **本文が自動で埋まる**
#   4. **本文を全部消す**
#   5. 生成したスカウト文を貼り付ける
#   6. 「確認してスカウトを送る」
#
# **API経路は3〜5を通らない。** SendSingleScout の payload に template の欄は
# 無く、scoutMessage をこちらが丸ごと渡す。つまり **テンプレートが供給していた
# 「募集内容」ブロックは、生成側で作らなければ文面に入らない。**
#
# テンプレートが入れていた内容と、その出所 (すべて job_offers/published に在る)::
#
#   募集職種    <- job_category.name
#   給与        <- job_offer_salaries[].employment_type_label / salary_bottom /
#                  salary_top / salary_type
#   住所        <- facility.prefecture_id / city_id / address_etc / building
#   アクセス    <- facility.access / auto_access
#   特徴        <- features[].name
#
# **職種 × 勤務形態 × 医院 でプロンプトを切り替える** という運用者の要件は、
# 手順2で選ぶ求人がその3つをすべて決めるので、jobOfferId と jobOfferSalaryId の
# 組で一意に定まる。プロンプト本体は運用者から別途受け取る。
# ------------------------------------------------------------------------

# 送信前チェック (既送信・対象外の除外) API。
# 無ければ null。
# (存在しないことが確認できた場合は null と書いてよい)
api.precheck.url_pattern: UNRESOLVED

# 送信枠の残数照会API。
#
# 2026-08-21 observe-api 3回目で **観測した**。一覧を開くと必ず飛んでいる::
#
#     GET /api/customers/messages/scout_count/
#       remaining_count   <number>
#       total_count       <number>
#
# **これは 8章の「残数は毎回読む」を満たす**。運用者の画面で2日のあいだに
# 62通 -> 51通 と動いており、引き算で持つと必ずずれる (媒体側で人が送る、
# 月次でリセットされる)。``remaining_count`` をそのまま読む。
#
# **値は見ていない。** 見たのはキーの名前と種別だけである (13.2)。
# どちらの数が「残り」かは名前が述べているが、突き合わせは段階4で行う。
api.quota.url_pattern: "https://customers.job-medley.com/api/customers/messages/scout_count/"

# 冪等キーを載せるヘッダ名。
#
# 2026-08-20 follow-send 3回目で、実際の送信リクエストの **ヘッダ名を全て**
# 観測した (値は観測していない -- cookie の値はセッションそのものである)::
#
#   accept, accept-language, content-type, cookie, origin, referer,
#   sec-ch-ua, sec-ch-ua-mobile, sec-ch-ua-platform, user-agent
#
# **どれも素のブラウザが付けるヘッダで、冪等キーの受け口は無い。**
# (CSRFトークンのヘッダも無い。cookie と origin で守っている作りである。)
#
# **この観測が言えること**: 媒体自身のクライアントは冪等キーを送っていない。
# **言えないこと**: サーバが受け付けないこと。ただし自前のクライアントが勝手な
# ヘッダを足しても、受け口が無ければ黙って無視されるだけである。
#
# したがって 9.2 の代替手順に従う -- **再試行の前に送信済み一覧を照会する**。
# あわせて 12.5 のとおり、送信APIの自動再試行はそもそも行わない。
api.idempotency_header: null

# 有料枠の送信API。
#
# 2026-08-20 follow-send 2回目で **観測** した。教わった導線を順に辿り
# (一覧の「スカウトを送る」→ 求人を選ぶ → 本文に目印 → 確認して送る)、最後の
# 押下で飛んだ非GETのうち、**本文へ書き込んだ目印を載せて運んでいた** のがこれ:
#
#   POST /api/customers/graphql/SendSingleScout
#
# 目印が載っていたことが、これが送信路であることの根拠である (原則3: 同時に
# 遮断された計測ビーコン7件と、推測ではなく観測で区別できている)。
# **この通信は中断済みで、送信は行われていない。**
api.send.paid.url_pattern: "https://customers.job-medley.com/api/customers/graphql/SendSingleScout"

# ------------------------------------------------------------------------
# **送信の入力型** (2026-08-23 introspect 実測29回目)。スキーマが直接答えた。
#
#   MessageScoutSendInput
#     memberId          Id!
#     jobOfferId        Id!
#     jobOfferSalaryId  Id!
#     scoutMessage      String!
#     searchUuid        String       <- **感嘆符が無い = 省略できる**
#
#   MessageScoutBulkSendInput
#     memberIds         [?]!         <- 後述
#     jobOfferId        Id!
#     jobOfferSalaryId  Id!
#     scoutMessage      String!
#     searchUuid        String
#
# **dryRun 相当は無い。** これは推測ではなく確定である -- スキーマが答えた。
# 段階4-2 (dryRun での検証) は使えないので、docs/ladder.md の 4-3 (少件数の
# 実送信) へ進む。
#
# **searchUuid は必須ではなかった。** 以前ここには「一覧の応答から持ち出せなければ
# 送信は組み立てられない」と書いていたが、それは観測した1本のリクエストに載って
# いたことからの推測だった。スキーマ上は省略できる。
# **ただし媒体自身のクライアントは常に送っている** ので、取れるときは送る --
# 省いたときにサーバが何をするかは観測していない (集計が変わるかもしれない)。
#
# ``[?]`` はこちらの問い合わせの深さ不足である。``type { name kind ofType {...} }``
# と2段しか辿っていないので、``[Id!]!`` のような3段の型が解決できていない。
# **媒体の事実ではなくこちらの限界なので、そう書いてある。** 一括送信を使うときに
# 深さを足して確かめること。
# ------------------------------------------------------------------------

# **成功とみなすHTTPステータスの集合。
# ** エンドポイントごとに違う (参照実装では 200 と 201 が混在した、6.2)。
# 段階4のdryRun検証で実測する。
#
# **注意: 送信は GraphQL である。** GraphQL は失敗しても HTTP 200 を返し、
# 応答本文の errors 配列にエラーを入れる作りが普通である。ステータスコードだけを
# 見る判定は **失敗を成功と数える** -- 原則2 の「静かなゼロ件」そのものになる。
# 段階4では本文の errors も併せて実測すること。
#
# **さらに、この mutation には3本目の失敗経路がある** (2026-08-23 実測31回目)。
# 選択集合に ``errorMessage`` が在る。ステータスにも errors 配列にも現れない
# 業務エラーがここへ来る。判定はすでに3本とも見る (api/success.py)。
# 段階4-3 の実送信では **3本すべての実測値を書き残すこと** --
# 成功時のステータス、成功時に errorMessage が null であること、そして
# 失敗時に何が入るか。
api.send.paid.success_statuses: UNRESOLVED

# 有料枠のpayload形状。
#
# 2026-08-20 follow-send 3回目で **観測** した。値はすべて種別に伏せてある
# (13.2)。伏せていないのは「本文がどのキーに入るか」だけで、それは自分で書いた
# 目印がそこに載っていたという観測そのものである。
#
# **推測では1つも当たらなかったはずの形である。**
#   - 本文のキーは body ではなく **scoutMessage**
#   - 求人IDだけでなく **jobOfferSalaryId** も要る (求人を選ぶと一緒に決まる)
#   - **searchUuid** が載る。送信は「どの検索から辿り着いた候補者か」に紐づく
#   - 件名の欄は無い (フォームにも無い)
#
# **2026-08-23 follow-send 4回目 (実測31回目) で query が入った。**
# 以前ここには「問い合わせ文 (query) が入っていない」と書いてあった -- 記録した
# 回の偵察が「長いから」という理由で query を落としていたためである。封筒ごと
# 記録するようにして、丸ごと差し替えた。以後 GraphQL は query 無しでは受け付けない
# ので、api.payloads.assert_sendable_graphql が送信の直前で撥ねる作りも残してある
# (座標の UNRESOLVED 検査は **キーごと欠けている穴を見ていない**。値が入っている
# ので「埋まっている」と判定されていた)。
#
# **残る宿題は ``<...>`` の欄である。** どれも観測はしたが、こちらが用意する値
# である (どの求人へ送るか、どの検索から辿ったか)。
#
# ------------------------------------------------------------------------
# **jobOfferId は埋まった** (2026-08-30 observe-job-offers 2回目・実測33回目)。
#
#   jobOfferId=811220
#     suggest_name = 神奈川県 医療法人幸明会 ヤガサキ歯科医院 歯科衛生士 正職員
#     job_category_name = 歯科衛生士
#
# 運用者が言葉で指定した求人 (ヤガサキ歯科医院 歯科衛生士 正職員) と、観測した
# 求人一覧の突き合わせで **一意に決まった**。推測ではない。
#
# **1回目は取り逃していた。** 媒体は最初 limit=1 で引いており、返ったのは
# コールセンターの求人1件だけだった。観測したURLの limit だけを 100 に差し替えて
# 引き直したら 11 件増えて 12 件になった。「1件しか無い」のではなく
# 「1件しか返っていない」だった -- 目盛りを見なければ区別が付かない形である。
#
# **同じ運用者の下に歯科衛生士の求人がもう1つある** (ダイヤモンド歯科医院・
# jobOfferId=1344691)。職種名だけで照らすと2件に当たるので、照合は
# 医院名・職種・雇用形態を揃えた文字列で行う
# (recon.observe_job_offers.WANTED_OFFER)。
#
# **jobOfferSalaryId は未確定のままである。** この求人には4つ在る::
#
#     3381377, 3381378, 3381379, 3381380
#
# どれを使うかは応答からは決まらない。**推測しない** (原則3)。
# 次の follow-send が、媒体自身のクライアントが選んだ値を記録する
# (payload_shape.REVEALED_KEYS が求人IDの2欄だけ値を残すようにしてある。
# memberId と searchUuid は伏せたままである -- 「IDだから安全」ではなく
# 「**誰の** IDか」で分けている)。
# ------------------------------------------------------------------------
#
# 埋め忘れたまま送ろうとしても、api.payloads.assert_fully_filled が送信の前に
# 止める。``<string>`` という文字列がスカウトとして飛ぶことは無い (13.6)。
#
# ------------------------------------------------------------------------
# **応答の形も、この query から確定した。** 選択集合はこの3つだけである::
#
#     result: messageScoutSend(input: $input) {
#       scoutedMemberId
#       errorMessage
#       __typename
#     }
#
# 2つ、設計に効く事実がある。
#
# 1. **``errorMessage`` という業務エラーの欄が在る。** HTTPステータスにも
#    ``errors`` 配列にも現れない、3本目の失敗経路である。媒体がわざわざ選択集合に
#    入れている以上、埋まる場面が在るということである。見落とすと HTTP 200・
#    errors 無しの応答が「送信済み」として記録され、その候補者は重複送信の防止に
#    掛かって二度と対象にならない -- **送っていないのに送ったことになる** (原則2)。
#    api/success.py の payload_error_paths がこの欄を見る。判定は保守的に倒して
#    ある (空でなければ失敗) -- 失敗応答そのものはまだ1度も観測していないので、
#    「どんなときに埋まるか」は分かっていない (原則3)。
#
# 2. **メッセージIDは返らない。** ``scoutedMemberId`` は会員のIDであって
#    メッセージのIDではない。したがって送信記録の platform_message_id は
#    送信路では常に空になる。返信の突合 (10.2) は件名で行う設計なので支障は
#    無いが、**会員IDをメッセージIDとして詰めない**。
# ------------------------------------------------------------------------
# ------------------------------------------------------------------------
# **送信の入力型の名前** (2026-08-22 read-bundle 実測27回目)。
#
# 配信ファイルから読んだ mutation は2本だった::
#
#     mutation SendSingleScout($input: MessageScoutSendInput!)
#     mutation BulkSendScout($input: MessageScoutBulkSendInput!)
#
# **入力型の名前は MessageScoutSendInput である。** docs/ladder.md は
# SendSingleScoutInput と書いていたが、それは操作名から推測した名前で、実際の
# 型名ではなかった。訂正した。
#
# **一括送信の経路が在る。** BulkSendScout / MessageScoutBulkSendInput --
# 画面の「スカウトを送る(0/50)」がこれである。存在は確定したが、payload も
# 成功判定も未観測なので api.send.free.* は UNRESOLVED のままにする。
# (そもそも「無料枠」かどうかも分かっていない。名前は一括送信としか言っていない。)
#
# **この経路では dryRun の有無は分からない。** 配信ファイルに入っているのは
# 操作の定義 (クエリ文書) であって、スキーマではない。文書に出るのは変数の
# *型名* だけで、その型がどんなフィールドを持つかは書かれていない。
# `scout recon introspect` がスキーマに直接尋ねる (query なので送信は起こらない)。
# ------------------------------------------------------------------------

api.send.paid.payload_template: |
  {
    "operationName": "SendSingleScout",
    "query": "mutation SendSingleScout($input: MessageScoutSendInput!) {\n  result: messageScoutSend(input: $input) {\n    scoutedMemberId\n    errorMessage\n    __typename\n  }\n}\n",
    "variables": {
      "input": {
        "jobOfferId": 811220,
        "jobOfferSalaryId": "<number>",
        "memberId": "<number>",
        "scoutMessage": "{{BODY}}",
        "searchUuid": "<string>"
      }
    }
  }

# ------------------------------------------------------------------------
# **送信payloadの5つの値が、どの読み取りから来るのか。**
#
# 2026-08-21 observe-api 3回目で、4つは出所らしいキーが見つかった。
# **名前が一致しただけで、値が同じである確認はまだ取れていない** (原則3)。
# 突き合わせは段階4で行う。
#
#   memberId          <- POST /api/customers/members/search/
#                          members[].id
#   searchUuid        <- POST /api/customers/members/search/
#                          search_uuid           (同じ応答に載っている)
#   jobOfferId        <- GET  /api/customers/job_offers/published/?limit=...
#                          data.job_offers[].id
#   jobOfferSalaryId  <- 同上
#                          data.job_offers[].job_offer_salaries[].id
#   scoutMessage      <- こちらが生成する本文 (座標ではない)
#
# **searchUuid が候補者一覧と同じ応答に載っていたことは、設計上の朗報である。**
# 送信は「どの検索から辿り着いた候補者か」に紐づいているので、別に取りに行く
# 経路が要るかもしれなかった。1回の一覧取得で候補者と検索識別子が揃う。
#
# **求人は候補者ごとではなく事前に1回取れる。** job_offers/published は一覧を
# 開いた時点で飛んでおり、``limit`` 付きのGETである。運用上は「どの求人へ
# 送るか」を先に決めて固定するので、送信のたびに引く必要は無い。
#
# 重複送信の判定にも同じ応答が使える::
#
#   members[].scouted                <bool>
#   members[].scouted_job_offer_ids  <array>
#   members[].scouted_at_list        <array>
#
# **ただしこれを唯一の根拠にはしない** (9章)。媒体側の値であり、こちらの
# 送信記録 (state) と食い違ったときにどちらが正かは決められていない。
# 突き合わせて、食い違ったら送らない側へ倒す。
# ------------------------------------------------------------------------

# ------------------------------------------------------------------------
# **同じ回に観測した、いま使わない読み取り。** 記録だけしておく。
# 名前とURLは観測そのもので、値は1つも見ていない (13.2)。
#
#   POST /api/customers/customer_search_conditions/search_manual/
#        保存した検索条件の一覧 (画面の「実践会＿衛生士」等)
#   POST /api/customers/customer_search_conditions/label/
#        保存条件の中身 (label.search_form。46キー)
#   POST /api/customers/scouted_members/search/
#        送信済み候補者の一覧 (scouted_members[], total, count, limit)
#   POST /api/customers/received_favorites/search/
#        「気になる」を押した候補者の一覧
#
# scouted_members/search は 9章の重複判定の照会先になりうるが、**応答に
# 会員IDが載っているかを確認していない** (見えたキーは job_offer_id と title
# だけだった)。確認するまで重複判定の根拠にはしない (原則3)。
# ------------------------------------------------------------------------

