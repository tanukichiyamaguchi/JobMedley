name: Recon (manual)

# 段階1〜3の偵察を **クラウドで** 実行するための手動ワークフロー。
#
# なぜ必要か: 段階1の合格条件「保存セッションで入り直せる」の判定には、媒体へ
# 到達できる実行環境が要る。開発をクラウドで行う運用では、手元に実行環境が無い。
# このワークフローが、その判定を行える唯一の場所になる。
#
# **送信系のコマンドはここに置かない。** 偵察は常設だが (3章)、送信と同じ
# ワークフローに同居させると、偵察のつもりで送信ステップを踏む事故が起きる。
on:
  workflow_dispatch:
    inputs:
      command:
        description: "実行する偵察コマンド"
        type: choice
        default: verify-session
        options:
          - session-check
          - verify-session
          - observe-login
          - observe-list
          - capture-open
          - follow-send
          - observe-api
          - observe-resume
          - read-bundle
          - preflight
          - coordinates
# ヘッドフルの選択肢は **置かない**。CIには画面を見る人間がいないので、
# 開いたところで誰も見られない。選べる形にすると「目視で確認した」つもりの
# 実行が積み重なる。

concurrency:
  group: scout-recon
  # 偵察は送信しないのでキャンセルしても状態は壊れない。とはいえ待たせるほどの
  # 実行時間でもないので、走行中は素直に待たせる。
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    # 探索は1押しごとに満了ぶんを待つことがあるので、押す回数に比例して伸びる。
    # 実測13回目は14手で7分半。上限を上げた分の余裕を持たせる (偵察は送信しない
    # ので、長引いても状態は壊れない)。
    timeout-minutes: 25

    # **本番ワークフローと同じ資格情報を渡す。** ここが揃っていないと preflight は
    # *存在しない環境* を点検することになる。実際に踏んだ: ANTHROPIC_API_KEY を
    # 渡していなかったので、シークレットを正しく登録しても「APIキーが未設定」で
    # 必ず失敗した -- 設定したのに実行環境へ届いていない、という 12.6 の事故を
    # 点検コマンド自身でやっていたことになる。
    # 差分は tests/guardrails/test_workflow_safety.py が禁じている。
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JOBMEDLEY_STORAGE_STATE_B64: ${{ secrets.JOBMEDLEY_STORAGE_STATE_B64 }}
      JOBMEDLEY_SESSION_CURL: ${{ secrets.JOBMEDLEY_SESSION_CURL }}
      JOBMEDLEY_EMAIL: ${{ secrets.JOBMEDLEY_EMAIL }}
      JOBMEDLEY_PASSWORD: ${{ secrets.JOBMEDLEY_PASSWORD }}
      # 13.6: 偵察であっても安全弁は明示的に渡す。**渡し忘れを既定値で救わない。**
      SCOUT_DRY_RUN: "true"
      SCOUT_STATE_LOSS_GUARD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # **段取りにも時間の上限を置く。**
      #
      # 実測14回目、この段取りが25分ハングしてジョブごと打ち切られ、偵察は一度も
      # 走らないまま往復を1つ失った。段取りに上限が無いと、詰まった段取りが
      # ジョブの持ち時間を全部食う -- しかも「何もせず打ち切られた」という形でしか
      # 現れないので、原因がこちらのコードに見える。
      #
      # 上限があれば、詰まりは **その段取りの失敗として** 見える (原則2 の
      # 「静かなゼロ件」を作らない)。
      - name: Install
        timeout-minutes: 6
        run: pip install -e '.'

      # **``--with-deps`` を付けない。**
      #
      # 実測15回目、この段取りは apt のミラー待ちで7分半止まり、上限で落ちた。
      # ブラウザ本体のダウンロードは始まってすらいない。詰まっていたのは
      # ``--with-deps`` が走らせる apt である。
      #
      # 付けなくてよい根拠は、成功していた回のログにある。実行環境には Chromium の
      # 必要ライブラリが **すべて既に入っていた**::
      #
      #     libasound2t64 is already the newest version
      #     libatk-bridge2.0-0t64 is already the newest version
      #     ... (実際のライブラリは全て「最新版が入っている」)
      #     The following NEW packages will be installed:
      #       fonts-freefont-ttf fonts-ipafont-gothic ... xfonts-utils
      #
      # **新規に入っていたのはフォントだけ** である。そしてこの偵察が読むのは
      # タグ名とクラス名だけで、描画された文字は読まない (13.2)。フォントが
      # 無くても観測は変わらない。
      #
      # 万一ライブラリが足りなければ **ブラウザの起動が失敗し、その旨が報告に出る**
      # (静かに空振りはしない)。そのときは --with-deps を戻す。
      - name: Install browser
        timeout-minutes: 8
        run: python -m playwright install chromium

      # 段階2の合格条件。**失敗しても続行させない** (12.6) ので、
      # continue-on-error は付けない。安全弁の実効値と由来も印字される。
      - name: Preflight
        if: inputs.command == 'preflight'
        run: scout preflight

      # 座標の一覧はブラウザも通信も要らない。何が足りないかを見るだけの用途。
      - name: Coordinates
        if: inputs.command == 'coordinates'
        run: scout coordinates

      # シークレットの形が正しいかだけを、媒体へ接続せずに確かめる。
      # **これはログインできることの確認ではない。** 形式の確認である。
      - name: Session check
        if: inputs.command == 'session-check'
        run: scout session check

      # 段階1の合格条件そのもの。
      # 終了コード: 0=復元された / 10=復元されなかった / 20=判定不能・未設定。
      - name: Verify session
        if: inputs.command == 'verify-session'
        run: scout recon verify-session

      # 段階1の座標を観測する。出力はURL・ページ名・セレクタ・要素の構造のみで、
      # **画面の文言は出さない** (13.2)。走査先の画面には氏名や会員番号を含む
      # リンクが並びうるため、文言をログへ残さない形にしてある。
      - name: Observe login
        if: inputs.command == 'observe-login'
        run: scout recon observe-login

      # 段階2の残り座標 (context.*, nav.list_ready_selector,
      # nav.drawer_close_selectors) を観測する。候補者の行を実際に1件開く
      # (ドロワーの閉じ方を観測するため) が、出力は要素の構造のみで
      # **画面の文言は出さない** (13.2、observe-login と同じ形)。
      - name: Capture open (gate armed)
        if: inputs.command == 'capture-open'
        run: scout recon capture-open

      # **教わった導線をそのまま辿る。** capture-open のような目隠しの探索ではなく、
      # 一覧の「スカウトを送る」→ 求人を選ぶ → 本文に目印 → 確認 → 送信、の順に
      # 進む。遮断は最初の押下より前から武装しているので送信は物理的に起こらない。
      # 出力は段ごとの到達可否と要素の構造のみで、**画面の文言は出さない** (13.2)。
      - name: Follow send (gate armed)
        if: inputs.command == 'follow-send'
        run: scout recon follow-send

      # **押さない偵察。** 一覧を開いて、媒体のGraphQL応答の「キーの形」だけを
      # 観測する。値は1つも出さない (13.2: 一覧の応答には氏名・会員番号・年齢・
      # 居住地が入っている)。ボタンには触れないので送信は起こしようがない。
      - name: Observe API (no clicks)
        if: inputs.command == 'observe-api'
        run: scout recon observe-api

      # **押す偵察。だが送信は通らない。** 遮断を許可制にしてあるので、GraphQL は
      # 読み取り (query) だけ、REST は観測済みの読み取り経路だけが通る。送信
      # (SendSingleScout) は mutation なので、押し間違えてもサーバへ届かない (13.6)。
      # レジュメはカードを押さないと飛ばないので、押さない observe-api では
      # 原理的に観測できない。
      - name: Observe resume (send blocked)
        if: inputs.command == 'observe-resume'
        run: scout recon observe-resume

      - name: Observe list
        if: inputs.command == 'observe-list'
        run: scout recon observe-list

      # 配信されている JavaScript から送信APIの操作名と変数の形を読む。
      # **通信は GET だけで、ボタンを1つも押さない** ので、送信は起こす操作
      # そのものが存在しない。出力は操作の種別・名前・変数の型だけで、配信
      # ファイルの原文は出さない (13.2)。
      - name: Read bundle (GET only)
        if: inputs.command == 'read-bundle'
        run: scout recon read-bundle

      # 構造スナップショット (タグ名・クラス名・親子関係のみ。文言・id・属性値は
      # 走査の時点で取っていないので、個人データは構造的に入らない = 13.2 の
      # 「構造ダイジェスト」)。これがあると、値が出なかった実行も無駄にならない --
      # 保存された実データに対して解析を手元で直せる (scout recon replay-list)。
      # 保持3日は偵察ダンプの既定 (paths.recon_dump_retention_days) に合わせてある。
      - name: Upload structure snapshot
        if: inputs.command == 'observe-list'
        uses: actions/upload-artifact@v4
        with:
          name: recon-structure
          path: artifacts/recon/structure/
          retention-days: 3
          if-no-files-found: ignore

      # 13.2: 上記の構造スナップショット以外の成果物は残さない。偵察の生データは
      # 個人データを含みうるため、判定結果 (ログに出る文字列) 以外は持ち出さない。
